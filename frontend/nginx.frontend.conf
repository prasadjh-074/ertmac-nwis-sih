# Serves the built React SPA and proxies /api/* to the backend
# container — the production equivalent of frontend/vite.config.ts's dev
# proxy (same /api prefix stripping, same target). No frontend code
# change was needed to make this work.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /engineer, /admin) must fall
    # back to index.html instead of a raw 404 on refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors vite.config.ts's dev proxy: strip the /api prefix, forward
    # to the backend service on the compose network (never "localhost"
    # inside a container — "backend" is the compose service name).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
